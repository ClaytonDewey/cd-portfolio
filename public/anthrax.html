<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown to Cursum Perficio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap"
    rel="stylesheet">

  <style>
    *,
    *::before,
    *::after {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: dark light;
    }

    body {
      font-family: 'Red Hat Text', sans-serif;
      background-image: url(./img/cursum-perficio.jpg);
      background-position: top center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    main {
      display: grid;
      place-items: center;
      block-size: 100dvh;
      text-align: center;
    }

    .countdown {
      background: rgba(238, 238, 238, .55);
      color: black;
      block-size: auto;
      inline-size: 100%;
      border-top: 1px solid lightgray;
      border-bottom: 1px solid lightgray;
    }

    .countdown__wrapper {
      max-inline-size: 1270px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
    }

    .countdown__timer {
      display: flex;
      gap: 10px;
      margin-block-end: 20px;
    }

    .timer__box {
      background-color: hsl(209, 61%, 16%);
      color: white;
      inline-size: 70px;
      block-size: 80px;
      display: grid;
      place-items: center;
      text-align: center;
      border-radius: 6px;
    }

    .timer__box p:not(.expired) {
      font-size: 40px;
      margin-block-end: 2.5px;
      letter-spacing: 2.5px;
      line-height: 1;
    }

    .timer__text {
      color: inherit;
      font-size: 30px;
      text-transform: uppercase;
    }

    @media (min-width: 64em) {
      .countdown__wrapper {
        flex-direction: row;
      }

      .countdown__timer {
        margin-block-end: 0;
      }

      .timer__box {
        block-size: 70px;
        inline-size: 70px;
      }

      .timer__box p:not(.expired) {
        font-size: 30px;
      }

      .timer__text {
        margin-inline-start: 20px;
      }
    }

    .sr-only {
      clip: rect(0 0 0 0);
      -webkit-clip-path: inset(50%);
      clip-path: inset(50%);
      height: rem(1);
      overflow: hidden;
      position: absolute;
      white-space: nowrap;
      width: rem(1);
    }
  </style>
</head>

<body>
  <main>
    <h1 class="sr-only">Countdown to Cursum Perficio</h1>
    <div class="countdown mt-3">
      <div class="countdown__wrapper">
        <div class="countdown__timer">
          <div class="timer__box">
            <div>
              <p class="days">30</p>
              <span>days</span>
            </div>
          </div>
          <div class="timer__box">
            <div>
              <p class="hours">12</p>
              <span>hours</span>
            </div>
          </div>
          <div class="timer__box">
            <div>
              <p class="minutes">37</p>
              <span>mins</span>
            </div>
          </div>
          <div class="timer__box">
            <div>
              <p class="seconds">15</p>
              <span>secs</span>
            </div>
          </div>
        </div>
        <div class="timer__text">until Cursum Perficio!</div>
      </div>
    </div>
  </main>

  <script>
    const countdownWrapper = document.querySelector('.countdown__wrapper');
    const items = document.querySelectorAll('.timer__box p');

    // const centralTarget = new Date('2026-09-06T18:30:00');
    const targetInCentral = new Date(Date.UTC(2026, 8, 18, 4, 0, 0));
    console.log(targetInCentral);
    const futureTime = targetInCentral.getTime();

    const getRemainingTime = () => {
      const now = new Date().getTime();
      const t = futureTime - now;

      const oneDay = 24 * 60 * 60 * 1000;
      const oneHour = 60 * 60 * 1000;
      const oneMinute = 60 * 1000;

      // calculate all values
      let days = Math.floor(t / oneDay);
      let hours = Math.floor((t % oneDay) / oneHour);
      let minutes = Math.floor((t % oneHour) / oneMinute);
      let seconds = Math.floor((t % oneMinute) / 1000);

      // set values array
      const values = [days, hours, minutes, seconds];
      const format = (item) => (item < 10 ? `0${item}` : item);

      items.forEach(function (item, index) {
        item.innerHTML = format(values[index]);
      });

      if (t < 0) {
        clearInterval(countdown);
        countdownWrapper.innerHTML = `
        <div class="timer__text ml-0">Cursum Perficio is out Now!</div>
    `;
      }
    };

    let countdown = setInterval(getRemainingTime, 1000);
    getRemainingTime();

  </script>
</body>

</html>
